services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-go-lab
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - jenkins_home:/var/jenkins_home
      - deploy_data:/opt/demo-app

volumes:
  jenkins_home:
  deploy_data:
